# ════════════════════════════════════════════════════════════════
#  VERIFY THE 301 MAP AGAINST THE RUNNING SERVICE.
#
#  The deploy has a smoke test and it checks nine URLs, none of them a
#  redirect. 4,683 of them went live in one commit, generated by a script,
#  never once exercised — and the failure mode is silent: a redirect to a
#  path that 404s looks identical to a working one until someone follows
#  it, and by then Google has followed it too.
#
#  So every single directive is checked, not a sample. The whole point of
#  a generated map is that no human read all of it; sampling would inherit
#  exactly that blind spot. 4,683 requests at twenty in parallel is about
#  a minute against our own service.
#
#  Three assertions per class:
#    every source path            → 301, and Location is EXACTLY the target
#    every distinct target        → 200 (a 301 into a 404 is worse than a 404)
#    the pages the map depends on → 200, right canonical, right h1
# ════════════════════════════════════════════════════════════════
name: Verify the 301 redirect map

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Service to verify (no trailing slash)"
        type: string
        default: "https://truthestate-web-26hb5vd3hq-as.a.run.app"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconstruct the map the service is actually serving
        # VERIFY WHAT SHIPPED, NOT WHAT IS COMMITTED.
        #
        # This read deploy/redirects.conf out of the repo and reported 154
        # wrong redirects and 77 dead targets against a service that was
        # right about every one of them. The deploy regenerates the map
        # from its own build and bakes that into the image; the committed
        # copy is a snapshot of some earlier build. Comparing the two just
        # measures how long ago the snapshot was taken.
        #
        # The deployed sitemap IS that build's sitemap, so regenerating
        # from it plus the committed crawl reproduces the shipped map
        # exactly — and if it ever does not, that disagreement is itself
        # the bug worth finding.
        env:
          BASE: ${{ inputs.base }}
        run: |
          node scripts/build-redirects.mjs deploy/old-urls.txt --sitemap "$BASE/sitemap.xml"
          echo "reconstructed $(grep -c '^location' deploy/redirects.conf) directive(s) from the live sitemap"

      - name: Every redirect returns 301 to exactly its target
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          # from → to, tab separated, straight out of the shipped config
          sed -n 's/^location = \(\S*\) { return 301 \(\S*\); }.*/\1\t\2/p' \
            deploy/redirects.conf > /tmp/pairs.tsv
          total=$(wc -l < /tmp/pairs.tsv)
          echo "checking $total redirect(s) against $BASE"

          cat > /tmp/one.sh <<'EOS'
          #!/usr/bin/env bash
          from="${1%%$'\t'*}"; to="${1##*$'\t'}"
          # -s no body, no redirect following: we are asserting the hop itself
          read -r code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "$BASE$from")
          want="$BASE$to"
          if [ "$code" != "301" ]; then echo "STATUS  $from  got $code want 301"; exit 0; fi
          # Location may come back absolute or relative; accept either spelling
          # of the same destination and nothing else.
          if [ "$loc" != "$want" ] && [ "$loc" != "$to" ]; then
            echo "TARGET  $from  →  ${loc:-(none)}   want $to"
          fi
          EOS
          chmod +x /tmp/one.sh
          export BASE
          # -P20: the service is ours and Cloud Run scales to 10 instances.
          tr -d '\r' < /tmp/pairs.tsv | xargs -d '\n' -P 20 -I{} /tmp/one.sh {} > /tmp/redirect-fails.txt
          bad=$(wc -l < /tmp/redirect-fails.txt)
          echo "  $((total - bad))/$total correct"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad redirect(s) wrong"
            head -50 /tmp/redirect-fails.txt
          fi
          {
            echo "### Redirects"
            echo ""
            echo "\`$((total - bad))\` of \`$total\` return 301 to exactly the mapped target."
            if [ "$bad" -gt 0 ]; then
              echo ""; echo '```'; head -50 /tmp/redirect-fails.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $([ "$bad" -eq 0 ] && echo 0 || echo 1)

      - name: Every redirect target actually serves a page
        # Runs even if the step above failed — knowing BOTH numbers is what
        # tells you whether the map is wrong or the build is missing pages.
        if: always()
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          sed -n 's/^location = \S* { return 301 \(\S*\); }.*/\1/p' deploy/redirects.conf \
            | sed 's/?.*//' | sort -u > /tmp/targets.txt
          total=$(wc -l < /tmp/targets.txt)
          echo "checking $total distinct target(s)"
          cat > /tmp/t.sh <<'EOS'
          #!/usr/bin/env bash
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$1")
          [ "$code" = "200" ] || echo "$1  →  $code"
          EOS
          chmod +x /tmp/t.sh
          export BASE
          xargs -a /tmp/targets.txt -d '\n' -P 20 -I{} /tmp/t.sh {} > /tmp/target-fails.txt
          bad=$(wc -l < /tmp/target-fails.txt)
          echo "  $((total - bad))/$total serve 200"
          {
            echo "### Redirect targets"
            echo ""
            echo "\`$((total - bad))\` of \`$total\` distinct targets serve 200."
            if [ "$bad" -gt 0 ]; then echo ""; echo '```'; head -40 /tmp/target-fails.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -gt 0 ]; then echo "::error::$bad target(s) do not serve 200"; head -40 /tmp/target-fails.txt; exit 1; fi

      - name: The new landing pages are real pages
        if: always()
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          fail=0
          for slug in under-3-cr-gurugram under-5-cr-gurugram under-8-cr-gurugram \
                      luxury-above-10-cr high-appreciation-cagr \
                      lowest-construction-delays new-launches; do
            body=$(curl -s --max-time 20 "$BASE/best-projects/$slug")
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/best-projects/$slug")
            canon=$(printf '%s' "$body" | grep -o 'rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')
            # Cards are server-rendered; a landing page with no projects on it
            # is thin content whatever its status code says.
            # grep -o piped to wc -l, because the page is one long line and
            # grep -c would answer "1". Braced with || true because under
            # `set -e -o pipefail` a grep that matches nothing returns 1 and
            # takes the whole script down — which is to say the assertion
            # would die exactly when it had something to report.
            cards=$({ printf '%s' "$body" | grep -o 'href="[^"]*/projects/gurugram-real-estate-[^"]*"' || true; } | wc -l)
            # THE CANONICAL NAMES PRODUCTION, NOT WHATEVER HOST ANSWERED.
            # This asserted $BASE and failed all seven pages, which were
            # right — the whole reason a canonical is emitted on a .run.app
            # preview is to point at the domain the site will live on. The
            # deploy's own smoke test has always asserted it this way for /.
            want="https://www.truthestate.in/best-projects/$slug"
            if [ "$code" != "200" ]; then echo "  FAIL $slug → HTTP $code"; fail=1; continue; fi
            if [ "$canon" != "$want" ] && [ "$canon" != "$want/" ]; then echo "  FAIL $slug canonical → ${canon:-none}"; fail=1; continue; fi
            if [ "$cards" -lt 5 ]; then echo "  FAIL $slug renders only $cards project card(s)"; fail=1; continue; fi
            echo "  ok   $slug → 200 · canonical ok · $cards cards"
            echo "- \`/best-projects/$slug\` — $cards projects" >> "$GITHUB_STEP_SUMMARY"
          done
          # An unknown filter must 404, not render an empty grid at 200.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/best-projects/not-a-real-filter")
          [ "$code" = "404" ] && echo "  ok   unknown filter → 404" || { echo "  FAIL unknown filter → $code (want 404)"; fail=1; }
          exit $fail

      - name: Internal links point at reports, not stubs
        # The fix that removed 1,936 links to redirect stubs. Asserted here
        # because it is invisible: the stubs work, so a regression would
        # cost only the link graph and show up nowhere else.
        if: always()
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          body=$(curl -s --max-time 30 "$BASE/intelligence/projects")
          # Braced || true, or a clean page kills the check that proves it is
          # clean: zero stub links means grep exits 1, and under pipefail
          # that ends the script before the assertion ever runs. This step
          # failed on its first outing for exactly that reason, reporting
          # nothing — the success case was the one it could not survive.
          stubs=$({ printf '%s' "$body" | grep -o 'href="[^"]*/intelligence/projects/[^"]*"' || true; } | wc -l)
          good=$({ printf '%s' "$body" | grep -o 'href="[^"]*/projects/gurugram-real-estate-[^"]*"' || true; } | wc -l)
          echo "catalogue: $good report link(s), $stubs stub link(s)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Catalogue links: \`$good\` to reports, \`$stubs\` to legacy stubs." >> "$GITHUB_STEP_SUMMARY"
          [ "$stubs" -eq 0 ] && [ "$good" -gt 90 ] || { echo "::error::catalogue is linking to stubs again"; exit 1; }
