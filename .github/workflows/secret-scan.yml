name: Secret scan

# Fails the push/PR when a committed file carries a credential — created after
# a live service-role key was found hardcoded in 12 ingestion scripts (stripped
# 19 Aug 2026, docs/NOTE_FOR_AG_SECURITY_AND_BRANCH_FIXES.md). Scans the
# CURRENT TREE on every push and PR. The public anon key is expected in the
# client and nginx config and is allowed; a service/other-role JWT never is.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree for credentials
        run: |
          fail=0
          # 1. Every JWT-shaped literal in the tree: decode the payload; only
          #    role:anon (the public client key) may be committed.
          grep -rIoE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude=package-lock.json 2>/dev/null \
          | sort -u | while IFS=: read -r file match; do
              payload=$(printf '%s' "$match" | cut -d. -f2 | tr '_-' '/+')
              pad=$(( (4 - ${#payload} % 4) % 4 ))
              [ "$pad" -gt 0 ] && payload="$payload$(head -c "$pad" /dev/zero | tr '\0' '=')"
              role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | grep -oE '"role" *: *"[^"]*"' || true)
              case "$role" in
                '"role":"anon"'|'"role": "anon"'|'') ;;  # public anon key, or not a Supabase JWT
                *) echo "::error file=$file::committed JWT with $role"; touch /tmp/secretfail ;;
              esac
            done
          [ -f /tmp/secretfail ] && fail=1
          # 2. Non-JWT secret shapes: Supabase sb_secret, Razorpay keys, private key blocks.
          if grep -rInE 'sb_secret_[A-Za-z0-9]{10,}|rzp_(live|test)_[A-Za-z0-9]{8,}|-----BEGIN( RSA)? PRIVATE KEY-----' . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude=package-lock.json 2>/dev/null; then
            echo "::error::secret-shaped literal committed (matches above)"
            fail=1
          fi
          [ "$fail" = 0 ] && echo "tree clean"
          exit $fail
