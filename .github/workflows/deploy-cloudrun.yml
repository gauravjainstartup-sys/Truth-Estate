name: Deploy to Cloud Run (production)

# ════════════════════════════════════════════════════════════════
#  PRODUCTION — www.truthestate.in.
#
#  Distinct from deploy.yml, which publishes the GitHub Pages PREVIEW.
#  The two differ in the only two things that matter about where a build
#  lives, and both are environment variables here:
#
#    NEXT_PUBLIC_BASE_PATH=""                     served from the root
#    NEXT_PUBLIC_ORIGIN=https://www.truthestate.in  canonicals, sitemap,
#                                                   JSON-LD, and the
#                                                   noindex switch
#
#  Note the empty string is passed EXPLICITLY. src/lib/site.ts and
#  next.config.ts both read it with `??`, so "" survives as the
#  production value; leaving the variable unset would silently produce a
#  build addressed to /Truth-Estate and 404 every link on the live domain.
#
#  Auto-deploys on every push to main. main is the founder's single-user
#  testing arena, and this candidate service (truthestate-web, a *.run.app
#  URL) is where they test — so a merge to main should land there with no
#  manual step. Code pushes reuse the committed Supabase snapshot (no DB
#  pull); the manual "Run workflow" still offers refresh_snapshot=true.
#
#  This is still NOT the live site: truthestate.in is served by
#  truthestate-with-supabase until its domain mapping is moved by hand.
#  That cutover stays a deliberate act — flipping the domain is the
#  decision, not the push. WHEN the domain is moved here, reinstate a gate
#  (drop the push trigger, or add an approval environment) so a merge to
#  main can no longer ship straight to the live domain.
# ════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_snapshot:
        description: "Re-pull the Supabase snapshot (otherwise reuse the cache)"
        type: boolean
        default: true

# Never two production deploys at once, and never cancel one midway —
# a half-pushed image is worse than a queued one.
concurrency:
  group: cloudrun-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no service-account key in the repo

env:
  # ── set these as repository VARIABLES (Settings → Secrets and variables
  #    → Actions → Variables). They are not secrets; the WIF binding is
  #    what grants access, and keeping them visible makes the deploy
  #    auditable. ──
  # Defaults are the founder's existing Cloud Run setup, read off the
  # console. Repository variables override them, so nothing has to be
  # configured for the common case and nothing is hardcoded either.
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'gen-lang-client-0356808352' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'truthestate' }}
  # NOT the live service. The existing `truthestate-with-supabase` keeps
  # serving truthestate.in until its domain mapping is moved by hand — so
  # a bad deploy costs a .run.app URL nobody has, not the live site. The
  # cutover is then a domain mapping change, which is instant and
  # reversible, rather than a rebuild under pressure.
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'truthestate-web' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A hung step used to sit here burning runner minutes until GitHub's
    # six-hour default killed it. Nothing in this job legitimately takes
    # more than a few minutes; the full run above did its work in under
    # two and then stalled.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show what this run will deploy to
        run: |
          echo "project : $GCP_PROJECT_ID"
          echo "region  : $GCP_REGION"
          echo "registry: $AR_REPOSITORY"
          echo "service : $SERVICE_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore the Supabase snapshot
        uses: actions/cache@v4
        with:
          path: .data-snapshot
          key: supabase-snapshot-${{ github.run_id }}
          restore-keys: supabase-snapshot-

      - name: Refuse to build production without the Maps key
        # THE SECRET IS CALLED GMAPS_KEY. This workflow asked for
        # NEXT_PUBLIC_GMAPS_KEY, which does not exist, and GitHub resolves a
        # missing secret to an empty string without a word of complaint. The
        # build then took the every-fallback-worked path: no key means
        # materialize-media skips the satellite bake and every project hero
        # renders as a plain gradient, and it means HAS_GMAPS is false at
        # compile time so all 97 location maps ship as OpenStreetMap. Both
        # degradations are deliberate and both are silent — the build was
        # green, the smoke test passed, and the site went live visibly worse
        # than the Pages one with nothing anywhere saying why.
        #
        # An absent key is a configuration mistake, never an intent, so it
        # stops the run here instead of shipping the consolation prize.
        env:
          GMAPS: ${{ secrets.GMAPS_KEY || secrets.NEXT_PUBLIC_GMAPS_KEY }}
        run: |
          if [ -z "$GMAPS" ]; then
            echo "::error::Neither GMAPS_KEY nor NEXT_PUBLIC_GMAPS_KEY is set on this repository."
            echo "Production would ship gradient heroes and OpenStreetMap fallbacks."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Maps key present (${#GMAPS} chars)."

      - name: Build the production export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ORIGIN: https://www.truthestate.in
          # Either name, because deploy.yml has always used the short one.
          NEXT_PUBLIC_GMAPS_KEY: ${{ secrets.GMAPS_KEY || secrets.NEXT_PUBLIC_GMAPS_KEY }}
          # Static Maps runs server-side, from this runner, with no Referer
          # header — so a browser key locked to website referrers is rejected
          # for the satellite bake even while it works perfectly in the page.
          # Set GMAPS_SERVER_KEY to a second key restricted by API instead of
          # referrer and the bake uses it; leave it unset and nothing changes.
          GMAPS_SERVER_KEY: ${{ secrets.GMAPS_SERVER_KEY }}
          SNAPSHOT_REFRESH: ${{ inputs.refresh_snapshot && '1' || '0' }}
          REQUIRE_SNAPSHOT: "1"
          # READ THE SNAPSHOT THE PREBUILD JUST DOWNLOADED.
          #
          # Omitting this did not fail the build — it made it fetch every
          # view live, once per page, and then hang. The first run took a
          # correct snapshot, ignored it, made several hundred HTTPS calls
          # to Supabase, finished all 1255 pages in 97 seconds, and never
          # exited: keep-alive sockets in the connection pool hold the Node
          # process open, so the step sat "in progress" for thirty minutes
          # with all its work done.
          #
          # The hang was the symptom. The two real faults were the read
          # egress the snapshot exists to avoid, and the race it exists to
          # prevent — independent per-page fetches can straddle the
          # pipeline's table rewrite, which is how a previous build
          # rendered half its pages from a half-written view.
          #
          # deploy.yml has always set this. This workflow was written from
          # scratch and did not.
          SUPABASE_FIXTURES: ".data-snapshot"
        # Tee'd so the next step can assert on what the build actually did.
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Prove the build read the snapshot, not the network
        # Reverting to live fetching looks like nothing but a slow build,
        # and it costs both the read egress and the consistency guarantee.
        # The two log formats are distinguishable, so assert on them.
        #   fixtures:  [supabase] fixtures · <view> → N rows
        #   network:   [supabase] <view> → N rows
        run: |
          log="$RUNNER_TEMP/build.log"
          fixtures=$(grep -c "\[supabase\] fixtures ·" "$log" || true)
          if [ "$fixtures" -eq 0 ]; then
            echo "::error::The build never read the snapshot — it fetched every view live."
            echo "SUPABASE_FIXTURES is unset or pointing at the wrong directory."
            grep -m5 "\[supabase\]" "$log" || true
            exit 1
          fi
          echo "Snapshot honoured: $fixtures fixture read(s), no live per-page fetching."

      - name: Report what the satellite bake actually managed
        # Warns rather than fails, and the distinction is deliberate. A
        # missing key is a mistake with a thirty-second fix, so the step
        # above stops the run. A key that Google refuses is a different
        # animal: the likeliest cause is a referrer restriction, which is
        # correct security applied to a request that legitimately has no
        # referrer, and the remedy is a second key — not something to
        # discover mid-launch with the deploy held hostage.
        #
        # It goes to the step summary, not just the log. The last run said
        # "no GMAPS key set" in line 4,112 of a green build and the first
        # anyone knew of it was a founder looking at a gradient where a
        # satellite should have been.
        run: |
          line=$(grep -m1 "\[materialize\] satellite:" "$RUNNER_TEMP/build.log" || echo "(no satellite line in the build log)")
          echo "$line"
          if echo "$line" | grep -qE "hero\(es\) baked"; then
            baked=$(echo "$line" | sed -n 's/.*satellite: \([0-9]*\) hero.*/\1/p')
            echo "🛰️  Satellite heroes baked: **$baked**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No satellite heroes were baked — project heroes ship as gradients."
            {
              echo "### 🛰️ No satellite heroes in this build"
              echo ""
              echo '```'
              echo "$line"
              grep -m3 "\[materialize\] satellite " "$RUNNER_TEMP/build.log" || true
              echo '```'
              echo ""
              echo "\`http-403\` here means Google refused the key. Static Maps is called"
              echo "from the runner with no Referer, so a referrer-restricted key cannot"
              echo "work — add a second key restricted by API and set \`GMAPS_SERVER_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild the 301 map against THIS build's sitemap
        # THE MAP AND THE BUILD MUST COME FROM THE SAME PLACE.
        #
        # The map was generated separately, against a sitemap taken from an
        # earlier deployment, and shipped with a later one. Comparison pages
        # are derived from live scored data, so the two sitemaps disagreed:
        # 77 pairs the map redirected to did not exist in the image that
        # went out. Permanent redirects into 404s, live, and green
        # everywhere — the deploy smoke test checks nine URLs and none of
        # them is a redirect.
        #
        # Regenerating here removes the possibility rather than testing for
        # it. out/sitemap.xml is this build's own output, so a target that
        # does not exist cannot be emitted. The crawl of the old site is
        # the perishable, expensive half and stays where it was: committed
        # in deploy/old-urls.txt, refreshed by its own workflow when the
        # old site changes.
        run: |
          if [ ! -s deploy/old-urls.txt ]; then
            echo "::error::deploy/old-urls.txt is missing or empty."
            echo "Run the 'Build the 301 redirect map' workflow to crawl the old site first."
            exit 1
          fi
          node scripts/build-redirects.mjs deploy/old-urls.txt --sitemap out/sitemap.xml \
            | tee "$RUNNER_TEMP/redirects.log"

          # Every target must be a file this build actually produced. try_files
          # resolves /foo to foo.html, so check both spellings, and strip any
          # query string — nginx matches locations on the path alone.
          missing=0
          while read -r t; do
            p="out${t%%\?*}"
            [ -f "$p" ] || [ -f "$p.html" ] || [ -f "$p/index.html" ] || { echo "  MISSING $t"; missing=$((missing+1)); }
          done < <(sed -n 's/^location = \S* { return 301 \(\S*\); }.*/\1/p' deploy/redirects.conf | sort -u)

          n=$(grep -c '^location' deploy/redirects.conf || echo 0)
          echo "$n redirect(s), $missing target(s) missing from this build"
          {
            echo "### 301 map"
            echo ""
            echo '```'
            sed -n '/old:/,$p' "$RUNNER_TEMP/redirects.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing redirect target(s) are not in this build — refusing to ship 301s into 404s."
            exit 1
          fi

      - name: Refuse to ship a build addressed to the preview
        # The single failure mode that would take the live domain down and
        # look fine in CI: BASE_PATH not applied, so every href and every
        # asset points at /Truth-Estate on a host that has no such path.
        run: |
          if grep -rqs "/Truth-Estate" out --include="*.html"; then
            echo "::error::out/ still contains /Truth-Estate — NEXT_PUBLIC_BASE_PATH did not apply."
            grep -rls "/Truth-Estate" out --include="*.html" | head -5
            exit 1
          fi
          grep -q "https://www.truthestate.in/sitemap.xml" out/robots.txt \
            || { echo "::error::robots.txt is not pointing at the production origin"; cat out/robots.txt; exit 1; }
          if grep -q 'name="robots" content="noindex' out/index.html; then
            echo "::error::the home page is noindexed — NEXT_PUBLIC_ORIGIN is not the production origin"
            exit 1
          fi
          echo "Export verified: root-relative, production origin, indexable."

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          # Created on first run rather than asked for. The existing service
          # was deployed from AI Studio, which does not necessarily leave a
          # Docker repository behind, and "which Artifact Registry repo?" is
          # a question with no good answer when there isn't one yet.
          gcloud artifacts repositories describe "$AR_REPOSITORY" \
            --location "$GCP_REGION" --project "$GCP_PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$AR_REPOSITORY" \
            --repository-format=docker --location "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" --description "Truth Estate static site images" --quiet

          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 10 \
            --quiet

      - name: Smoke-test what actually went live
        # A green deploy is not a working site. These are the four things
        # that have actually broken on this kind of cutover before.
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" \
                --project "$GCP_PROJECT_ID" --format='value(status.url)')
          echo "Service: $URL"
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$1")
            [ "$code" = "$2" ] && echo "  ok   $1 → $code" || { echo "  FAIL $1 → $code (want $2)"; fail=1; }
          }
          check "/" 200
          check "/intelligence" 200
          check "/intelligence/markets/spr" 200          # extensionless route → markets/spr.html
          check "/projects/gurugram-real-estate-dlf-the-arbour-golf-course-road-extension-gcre-sector-63" 200
          check "/robots.txt" 200
          check "/sitemap.xml" 200
          check "/definitely-not-a-page" 404
          # The canonical must name PRODUCTION, whatever host answered the
          # request — that is the whole point of it on a .run.app URL.
          #
          # Trailing slash is optional and deliberately not asserted.
          # metadataBase resolves `canonical: "/"` differently depending on
          # whether the base URL carries a path, so the preview emits
          # ".../Truth-Estate/" and production emits "https://www.truthestate.in"
          # with no slash. Google normalises the two; a test that insists on
          # one shape fails a correct page, which is what happened on the
          # first successful deploy.
          canon=$(curl -s "$URL/" | grep -o 'rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')
          case "$canon" in
            https://www.truthestate.in|https://www.truthestate.in/)
              echo "  ok   canonical → $canon" ;;
            *)
              echo "  FAIL canonical → ${canon:-(none)} (want https://www.truthestate.in)"; fail=1 ;;
          esac

          # The image is the site, so prove the page is the one we built
          # rather than a stale revision Cloud Run kept serving.
          curl -s "$URL/intelligence" | grep -q "Truth Intelligence" \
            && echo "  ok   content served from this image" \
            || { echo "  FAIL /intelligence has no expected content"; fail=1; }

          exit $fail
