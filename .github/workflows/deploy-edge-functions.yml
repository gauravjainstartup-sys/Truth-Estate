name: Deploy Supabase Edge Functions

# ⚠️ TEMPORARY (reverted immediately after use): reduced to deploy ONLY
# capture-lead. This branch has diverged from main on chat-signin /
# google-signin / twilio-otp (main is ahead there), so the usual all-functions
# deploy from THIS branch would revert main's newer auth work in production.
# capture-lead on this branch is a strict superset of main's (newer CORS + all
# intents incl. compare-unlock / registered), so it alone is safe to ship.
# The full step list is restored by the git revert that follows this commit.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy capture-lead --no-verify-jwt --project-ref lyetvabfgaidvqrbmaoy
