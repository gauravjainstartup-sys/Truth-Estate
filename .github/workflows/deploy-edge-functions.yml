name: Deploy Supabase Edge Functions

# ── THIS BRANCH'S COPY IS SINGLE-FUNCTION-ONLY, ON PURPOSE ──────────────
#
# main and this branch have DIVERGED on supabase/functions/ (main carries
# newer auth work in chat-signin / google-signin, among others). main's copy
# of this workflow deploys the FULL function list on every push to main —
# correct there. Here, that same full list would deploy this branch's OLDER
# copies over main's live auth functions, and nothing about the run would
# look wrong.
#
# A workflow_dispatch runs the workflow file FROM THE DISPATCHED REF, so
# this rewritten copy is what runs when dispatching on this branch: it
# requires naming exactly ONE function directory and deploys only that.
# (Registered-workflow identity is the file PATH, which is why this reuses
# deploy-edge-functions.yml rather than a new filename — a workflow file
# that exists only on a non-default branch is not dispatchable at all;
# that is how the never-registered deploy-one-edge-function.yml died.)
#
# The push trigger is deliberately absent on this branch: functions ship
# from here only by explicit, named dispatch. At branch reconciliation,
# keep main's full-list copy for main and re-derive this guard if a
# long-lived working branch remains.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function directory under supabase/functions/ to deploy (e.g. challenge-router)"
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show what will deploy
        run: |
          echo "ref     : ${{ github.ref_name }}"
          echo "function: ${{ inputs.function }}"
          test -d "supabase/functions/${{ inputs.function }}" || { echo "::error::no such function directory"; exit 1; }
      # --no-verify-jwt: the public functions are called with the anon key and
      # authorise inside — matching every line of main's full-list copy.
      - run: supabase functions deploy "${{ inputs.function }}" --no-verify-jwt --project-ref lyetvabfgaidvqrbmaoy
