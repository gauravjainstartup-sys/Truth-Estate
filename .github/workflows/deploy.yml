name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual "Run workflow" button — publish the latest Supabase data on demand.
  workflow_dispatch:
  # Near-real-time publish: Supabase Database Webhook → the `publish-deploy`
  # Edge Function → this repository_dispatch. A DB edit rebuilds the site with
  # fresh data (SNAPSHOT_REFRESH=1) in ~3–4 min, no manual step. The Edge
  # Function debounces bursts so a bulk pipeline rewrite is one rebuild, not many.
  repository_dispatch:
    types: [supabase-data-changed]
  # Scheduled DATA refresh — the site is a static export, so this re-fetches
  # Supabase and redeploys, surfacing DB edits with no manual step. The schedule,
  # the manual "Run workflow" button, AND the repository_dispatch webhook re-pull
  # the DB/media snapshot (SNAPSHOT_REFRESH=1 below); ordinary code pushes reuse
  # the cached snapshot and cost ZERO Supabase egress. The daily cron is the
  # backstop so nothing is ever more than a day stale. GitHub may delay cron runs.
  # PAUSED 2026-08-10 at founder's request — stop the scheduled Supabase pull.
  # NOTE: the repository_dispatch webhook above still re-pulls on every DB
  # change (SNAPSHOT_REFRESH=1); left as-is and flagged to the founder. Manual
  # "Run workflow" and code pushes are unaffected. Re-enable the daily backstop
  # by uncommenting both lines.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress production deploys finish
# (the GitHub Pages environment cancels a deployment if a newer one supersedes
# it — cancelling in-progress here caused spurious "Deployment cancelled").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Media cache — carries fetched Storage assets across builds. The
      # materializer revalidates every URL with a conditional GET (ETag), so
      # an unchanged asset costs headers instead of a re-download and the
      # hourly rebuild stops re-pulling the whole media set from Supabase.
      # Unique key + restore-keys prefix = restore the newest, save updated.
      - uses: actions/cache@v4
        with:
          path: .media-cache
          key: media-cache-${{ github.run_id }}
          restore-keys: media-cache-
      # Data snapshot cache — carries the last DB/media pull across builds so a
      # code push reuses it (zero Supabase egress). Only a schedule / manual run
      # refreshes it (SNAPSHOT_REFRESH below).
      - uses: actions/cache@v4
        with:
          path: .data-snapshot
          key: data-snapshot-${{ github.run_id }}
          restore-keys: data-snapshot-
      - run: npm run build
        env:
          # Re-pull the Supabase snapshot ONLY on a scheduled data refresh or the
          # manual "Run workflow" button — code pushes reuse the cached snapshot
          # and never touch Supabase. This is the egress fix.
          SNAPSHOT_REFRESH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && '1' || '' }}
          # PDFs above this many MB are NOT baked — the card keeps its
          # build-rendered cover and the click serves the file straight from
          # Supabase Storage, which is billed egress on every open. The only
          # over-cap files today are 3 brochures (22–39 MB, ~95 MB total), so
          # a QA session that opens them repeatedly can burn gigabytes of
          # Supabase egress. Baking them (well under GitHub's 100 MB/file and
          # ~1 GB artifact limits) moves that traffic to GitHub Pages' free
          # bandwidth — same viewer, same-origin, zero Supabase egress. Raised
          # 10 → 50 for that reason. Watch the artifact total if many large
          # brochures land later; a per-file cap is not a total-size budget.
          MEDIA_PDF_CAP_MB: "50"
          # One consistent DB sample per build: the snapshot prebuild step
          # fills .data-snapshot and every page reads it, so a build can no
          # longer race the pipeline's table rewrite into half-empty pages.
          # REQUIRE_SNAPSHOT fails the build if the snapshot can't be taken —
          # the previous deploy stays live instead of shipping a gutted site.
          SUPABASE_FIXTURES: ".data-snapshot"
          REQUIRE_SNAPSHOT: "1"
          # Google Maps JS key (referrer-locked to this site; safe in the
          # client bundle by design). Absent secret → the location maps
          # build with the free OSM fallback instead — never a broken map.
          NEXT_PUBLIC_GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
