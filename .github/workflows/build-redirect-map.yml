# ════════════════════════════════════════════════════════════════
#  BUILD THE 301 MAP — from a browser, with no checkout and no build.
#
#  The crawl has to run somewhere that can reach the old site. That is
#  not the agent sandbox (its proxy refuses every host but GitHub and
#  Supabase) and it need not be a laptop: a GitHub runner has plain
#  internet access and the repository already on disk. So the whole job
#  is one button on the Actions tab.
#
#  It reads the NEW site's addresses from the deployed sitemap rather
#  than a fresh build. A production build for this would take four
#  minutes, pull the Supabase snapshot and several hundred megabytes of
#  media, and yield one XML file the running service is already serving.
#  Reading it from the deployment is also stricter: every redirect target
#  is then a URL that demonstrably answers, not one a rebuild predicts.
#
#  The result is committed, because a redirect map is reviewed by reading
#  it. Only confident matches are emitted as live 301s; anything with
#  more than one plausible target, or none, is written out commented with
#  its candidates. A wrong 301 tells Google two unrelated pages are one
#  page and takes a re-crawl of both to undo, so the script never guesses
#  and neither does this.
# ════════════════════════════════════════════════════════════════
name: Build the 301 redirect map

on:
  workflow_dispatch:
    inputs:
      old_site:
        description: "The live site to crawl (the one with the rankings)"
        type: string
        default: "https://www.truthestate.in"
      sitemap:
        description: "Sitemap of the NEW build — the deployed Cloud Run service"
        type: string
        default: "https://truthestate-web-26hb5vd3hq-as.a.run.app/sitemap.xml"
      branch:
        description: "Branch to commit deploy/redirects.conf to"
        type: string
        default: "claude/database-schema-summary-fhhb3k"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # A crawl of a few hundred pages at 20s worst case each. Bounded so a
    # slow old host cannot sit here for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm ci`. The script imports nothing but node:fs — installing
      # 811 MB of dependencies to run it would be the slowest part of the job.

      - name: Crawl and match
        run: |
          node scripts/build-redirects.mjs \
            --crawl "${{ inputs.old_site }}" \
            --sitemap "${{ inputs.sitemap }}" 2>&1 | tee "$RUNNER_TEMP/map.log"

      - name: Put the result where it will be read
        # The counts belong on the run's front page, not at the end of a
        # log. "UNMATCHED: 41" is the single number that decides whether
        # this map is ready to ship, and it should not need looking for.
        run: |
          {
            echo "## 301 redirect map"
            echo ""
            echo '```'
            sed -n '/old:/,$p' "$RUNNER_TEMP/map.log"
            echo '```'
            echo ""
            echo "Committed to \`${{ inputs.branch }}\` as \`deploy/redirects.conf\`."
            echo "Anything listed as ambiguous or unmatched is commented out in that file"
            echo "and needs a decision before cutover — an unmatched path 404s."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit it
        run: |
          if git diff --quiet -- deploy/redirects.conf; then
            echo "No change to deploy/redirects.conf — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/redirects.conf
          git commit -m "Regenerate the 301 map from a crawl of ${{ inputs.old_site }}

          Generated by .github/workflows/build-redirect-map.yml. Live 301s are
          the confident matches only; ambiguous and unmatched paths are written
          out commented, with their candidates, for a human to settle."
          # Someone may have pushed while the crawl ran; rebase rather than
          # fail, since this commit touches exactly one generated file.
          git pull --rebase origin "${{ inputs.branch }}"
          git push origin HEAD:"${{ inputs.branch }}"
