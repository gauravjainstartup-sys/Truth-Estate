# ════════════════════════════════════════════════════════════════
#  301s from the OLD truthestate.in to the new site.
#
#  EMPTY UNTIL THE OLD URL LIST ARRIVES. Every path the current site
#  ranks for that this build does not serve at the same address needs a
#  line here, or its ranking is dropped on the floor at cutover — Google
#  treats a 404 as "this page is gone", and the equity does not migrate
#  to a page it was never told about.
#
#  Source the list from Search Console (Pages → export) or a crawl of
#  www.truthestate.in, then map each old path to its new one.
#
#  Format:
#      location = /old-path { return 301 /new-path; }
#      location ^~ /old-section/ { return 301 /new-section/; }
#
#  Use `=` for exact matches and `^~` for prefixes. A trailing $request_uri
#  preserves query strings where that matters.
#
#  Example:
#      location = /projects/dlf-arbour { return 301 /projects/gurugram-real-estate-dlf-the-arbour-golf-course-road-extension-gcre-sector-63; }
# ════════════════════════════════════════════════════════════════
